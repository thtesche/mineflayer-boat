name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: echo "✅ Unit tests passed"

  note:
    name: Local Testing Required
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ℹ️  Docker & Integration Tests run locally:"
          echo ""
          echo "  make docker-build          # Build Docker images"
          echo "  make test-docker           # Test both versions (1.21.4 + 26.1)"
          echo "  npm run test:integration   # Run integration tests"
          echo ""
          echo "GitHub Actions: Unit tests only (no Docker/server)"

  status:
    name: Test Status
    runs-on: ubuntu-latest
    needs: [unit]
    if: always()
    steps:
      - name: Check test status
        run: |
          if [ "${{ needs.unit.result }}" = "failure" ]; then
            echo "❌ Unit tests failed"
            exit 1
          else
            echo "✅ GitHub Actions tests passed"
            echo ""
            echo "ℹ️  For complete testing, run locally:"
            echo "  make docker-build && make test-docker"
            exit 0
          fi
